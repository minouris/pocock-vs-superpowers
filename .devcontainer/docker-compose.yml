version: '3.8'

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-mcr.microsoft.com/devcontainers/base:ubuntu-24.04}

    image: pocock-vs-superpowers:dev

    volumes:
      # Mount workspace
      - ..:/workspaces/pocock-vs-superpowers:cached

      # OpenCode configuration mounts
      - ${HOME}/.config/opencode:/home/vscode/.config/opencode
      - ${HOME}/.config/opencode:/workspaces/pocock-vs-superpowers/.config/opencode
      - ../.local/state/opencode:/home/vscode/.local/state/opencode
      - ../.local/share/opencode:/home/vscode/.local/share/opencode

    environment:
      - HOST_WORKSPACE_ROOT=/workspaces/pocock-vs-superpowers
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}

    user: vscode

    # Keep container running
    command: sleep infinity

    # Use host network (can be overridden if needed)
    network_mode: host

    # Ensure proper init process
    init: true
